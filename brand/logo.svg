<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a2b"/>
      <stop offset="1" stop-color="#08121f"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34e3a8"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0a8f63"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="232" r="210" fill="url(#glow)"/>

  <!-- main droplet -->
  <path d="M256 96
           C256 96 356 214 356 286
           a100 100 0 1 1 -200 0
           C156 214 256 96 256 96 Z"
        fill="url(#drop)"/>
  <!-- glossy highlight -->
  <ellipse cx="218" cy="262" rx="30" ry="46" fill="#ffffff" opacity="0.28"
           transform="rotate(-18 218 262)"/>

  <!-- autopilot stream: three descending drips -->
  <circle cx="256" cy="430" r="15" fill="#34e3a8"/>
  <circle cx="210" cy="452" r="9"  fill="#10b981" opacity="0.85"/>
  <circle cx="302" cy="452" r="9"  fill="#10b981" opacity="0.85"/>
</svg>
